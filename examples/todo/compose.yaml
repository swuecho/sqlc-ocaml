services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: todo
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
    ports:
      - "5438:5432"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d todo"]
      interval: 1s
      timeout: 3s
      retries: 30

  app:
    build:
      context: .
      args:
        EXAMPLE_BASE_IMAGE: ${EXAMPLE_BASE_IMAGE:-sqlc-ocaml-example-base:local}
    environment:
      DATABASE_URL: postgresql://todo:todo@db:5432/todo
    depends_on:
      db:
        condition: service_healthy
    profiles: ["app"]
