services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: todobackend
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
    ports:
      - "5439:5432"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d todobackend"]
      interval: 1s
      timeout: 3s
      retries: 30

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://todo:todo@db:5432/todobackend
      PUBLIC_TODOS_URL: http://localhost:8080/todos
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

