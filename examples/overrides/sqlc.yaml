version: "2"
plugins:
  - name: ocaml
    process:
      cmd: ../../bin/sqlc-gen-ocaml-linux
      format: json
sql:
  - engine: postgresql
    schema: schema.sql
    queries: queries.sql
    codegen:
      - plugin: ocaml
        out: .
        options:
          filename: queries
          overrides:
            - column: users.email
              nullable: true
              type: Email.t
              codec: Email.codec
