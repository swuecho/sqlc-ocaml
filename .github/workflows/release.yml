name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: make quickcheck

      - name: Build release archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          version="${VERSION#v}"
          mkdir -p dist

          for target in \
            linux/amd64 \
            linux/arm64 \
            darwin/amd64 \
            darwin/arm64 \
            windows/amd64 \
            windows/arm64
          do
            os="${target%/*}"
            arch="${target#*/}"
            archive="sqlc-gen-ocaml_${version}_${os}_${arch}"
            executable="sqlc-gen-ocaml"

            if [ "$os" = "windows" ]; then
              executable="${executable}.exe"
            fi

            mkdir -p "build/${archive}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -o "build/${archive}/${executable}" ./cmd/sqlc-gen-ocaml

            if [ "$os" = "windows" ]; then
              (cd build && zip -q -r "../dist/${archive}.zip" "$archive")
            else
              tar -C build -czf "dist/${archive}.tar.gz" "$archive"
            fi
          done

          cd dist
          LC_ALL=C sha256sum sqlc-gen-ocaml_* > checksums.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --verify-tag \
              --generate-notes \
              --title "$TAG"
          fi
