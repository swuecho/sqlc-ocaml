name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: make check

  examples:
    name: End-to-end examples
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run database-backed examples
        run: make examples-e2e

      - name: Check generated code is current
        run: git diff --exit-code -- examples

      - name: Show container logs on failure
        if: failure()
        run: |
          docker compose -f examples/todo/compose.yaml logs --no-color || true
          docker compose -f examples/todo_backend/compose.yaml logs --no-color || true
          docker compose -f examples/overrides/compose.yaml logs --no-color || true
          docker compose -f examples/async/compose.yaml logs --no-color || true

      - name: Stop example containers
        if: always()
        run: |
          docker compose -f examples/todo/compose.yaml down --volumes --remove-orphans || true
          docker compose -f examples/todo_backend/compose.yaml down --volumes --remove-orphans || true
          docker compose -f examples/overrides/compose.yaml down --volumes --remove-orphans || true
          docker compose -f examples/async/compose.yaml down --volumes --remove-orphans || true

  ocaml:
    name: Generated OCaml
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2"
          dune-cache: true

      - name: Install OCaml dependencies
        run: >-
          opam install --yes
          dune
          ocamlfind
          caqti-lwt
          caqti-async
          caqti-driver-postgresql
          lwt
          ptime
          uuidm
          yojson
          uri
          dream

      - name: Parse generated Lwt and Async code
        run: opam exec -- go test -count=1 ./internal/generator

      - name: Build Lwt examples
        run: |
          (cd examples/todo && opam exec -- dune build)
          (cd examples/todo_backend && opam exec -- dune build)
          (cd examples/overrides && opam exec -- dune build)
          (cd examples/async && opam exec -- dune build)
