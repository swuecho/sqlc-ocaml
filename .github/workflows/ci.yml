name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: make check

  examples:
    name: End-to-end examples
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build cached example base
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/example-base.Dockerfile
          tags: sqlc-ocaml-example-base:local
          load: true
          cache-from: type=gha,scope=sqlc-ocaml-example-base
          cache-to: type=gha,mode=max,scope=sqlc-ocaml-example-base

      - name: Run database-backed examples
        run: EXAMPLE_BASE_PREBUILT=true make examples-e2e

      - name: Check generated code is current
        run: git diff --exit-code -- examples

      - name: Show container logs on failure
        if: failure()
        run: |
          docker compose -f examples/todo/compose.yaml logs --no-color || true
          docker compose -f examples/todo_backend/compose.yaml logs --no-color || true
          docker compose -f examples/overrides/compose.yaml logs --no-color || true
          docker compose -f examples/async/compose.yaml logs --no-color || true

      - name: Stop example containers
        if: always()
        run: |
          docker compose -f examples/todo/compose.yaml down --volumes --remove-orphans || true
          docker compose -f examples/todo_backend/compose.yaml down --volumes --remove-orphans || true
          docker compose -f examples/overrides/compose.yaml down --volumes --remove-orphans || true
          docker compose -f examples/async/compose.yaml down --volumes --remove-orphans || true
